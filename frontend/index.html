<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c10" />

    <!-- SEO Meta Tags -->
    <title>Movi — Movies, Web Series &amp; Anime</title>
    <meta name="description" content="Movi — Search thousands of movies, web series and anime. Find Hindi dubbed, South Indian, Hollywood, Bollywood, and anime with download links from multiple sources." />
    <meta name="keywords" content="movies download, web series, anime, hindi dubbed movies, south indian movies, bollywood, hollywood, filmyfly, filmyzilla, 720p, 1080p" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://movie.guru/" />

    <!-- Open Graph (Facebook, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Movi — Movies, Web Series &amp; Anime" />
    <meta property="og:description" content="Search thousands of movies, web series and anime across multiple sources." />
    <meta property="og:url" content="https://movie.guru/" />
    <meta property="og:image" content="https://movie.guru/og-cover.jpg" />
    <meta property="og:site_name" content="Movi" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Movi — Movies, Web Series &amp; Anime" />
    <meta name="twitter:description" content="Search thousands of movies, web series and anime." />
    <meta name="twitter:image" content="https://movie.guru/og-cover.jpg" />

    <!-- Sitemap -->
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />

    <!-- Structured Data: WebSite for Google Sitelinks Search Box -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Movi",
      "url": "https://movie.guru/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://movie.guru/#/home?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
